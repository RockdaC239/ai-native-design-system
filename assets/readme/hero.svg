<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">AI Native Design System</title>
  <desc id="desc">把视觉方向写成 DESIGN.md，用 tokens 固定数值，用 showcase 展示效果，再用于产品界面。</desc>
  <rect width="1200" height="390" rx="24" fill="#111525"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="60" y="64" fill="#B8A8FF" font-size="19" font-weight="700" letter-spacing="2">CODEX SKILL / DESIGN AS A SYSTEM</text>
    <text x="58" y="144" fill="#F7F6FB" font-size="55" font-weight="700">AI Native</text>
    <text x="58" y="208" fill="#F7F6FB" font-size="55" font-weight="700">Design System</text>
    <text x="61" y="266" fill="#C8C8D6" font-size="25">让设计意图、具体数值和视觉样张</text>
    <text x="61" y="302" fill="#C8C8D6" font-size="25">成为 AI 可持续遵守的共同依据</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <path d="M620 144 H1139 M620 232 H1139 M620 320 H1139" stroke="#34394D" stroke-width="2"/>
    <text x="624" y="103" fill="#A894FF" font-size="23" font-weight="700">01</text>
    <text x="682" y="103" fill="#F7F6FB" font-size="30" font-weight="650">DESIGN.md</text>
    <text x="682" y="130" fill="#C8C8D6" font-size="19">视觉意图与生成规则</text>

    <text x="624" y="191" fill="#A894FF" font-size="23" font-weight="700">02</text>
    <text x="682" y="191" fill="#F7F6FB" font-size="30" font-weight="650">Tokens</text>
    <text x="682" y="218" fill="#C8C8D6" font-size="19">颜色 · 字体 · 间距 · 状态</text>
    <rect x="1036" y="169" width="24" height="24" rx="6" fill="#9B88F5"/>
    <rect x="1068" y="169" width="24" height="24" rx="6" fill="#E8B2C6"/>
    <rect x="1100" y="169" width="24" height="24" rx="6" fill="#F7F6FB"/>

    <text x="624" y="279" fill="#A894FF" font-size="23" font-weight="700">03</text>
    <text x="682" y="279" fill="#F7F6FB" font-size="30" font-weight="650">Showcase</text>
    <text x="682" y="306" fill="#C8C8D6" font-size="19">可检查的组件与界面样张</text>
  </g>
  <path d="M60 340 H1140" stroke="#34394D" stroke-width="2"/>
  <text x="60" y="369" fill="#9997B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">INTENT → RULES → PROOF → UI</text>
</svg>
